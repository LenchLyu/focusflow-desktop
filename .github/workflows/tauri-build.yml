name: Tauri desktop verification

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload the test installers to this workflow run
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    # WebView2 automation fails on the Server 2025 runner.
    # See https://github.com/actions/runner-images/issues/14738.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: rustup override set 1.100.0
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: inputs.upload_artifacts
        with:
          name: FocusFlow-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: rustup override set 1.100.0
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm test
      - run: npm run build:mac
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - name: Verify macOS architectures and disk image
        run: |
          bundle="src-tauri/target/universal-apple-darwin/release/bundle"
          app="$bundle/macos/FocusFlow.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          binary="$app/Contents/MacOS/$executable"
          lipo "$binary" -verify_arch arm64 x86_64
          lipo -archs "$binary"
          hdiutil verify "$bundle"/dmg/*.dmg
      - uses: actions/upload-artifact@v4
        if: inputs.upload_artifacts
        with:
          name: FocusFlow-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
